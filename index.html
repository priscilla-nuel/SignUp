<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="container">
        <div class="image">
            <img src="formimage.webp" alt="background-image" class="formimage">
            <img src="TheOdinLogo.png" alt="the-odin-logo" class="theOdinLogo" style="height: 50px; width: 100px;">
            <div class="logo">
                <img src="logo.png" alt="Logo">
                <h2>ODIN</h2>
            </div>

        </div>
        <div class="content">
            <div class="contentBox">
                <div class="top">
                    <p>
                        <strong>This is not a real online service! You know you need
                            something like this in your life to help you realise your deepest dreams.<br>
                            Sign up now to get started.
                        </strong>
                    </p>
                    <p id="secondPara"><strong>You know you what to do</strong></p>
                </div>
                <div class="middle">
                    <p>Lets do this!</p>
                    <form action="#" method="post">
                        <fieldset class="form-grid">

                            <div class="form-group">
                                <label for="firstName">FIRST NAME</label>
                                <input id="firstName" name="firstName" type="text" placeholder="Thor">
                            </div>

                            <div class="form-group">
                                <label for="lastName">LAST NAME</label>
                                <input id="lastName" name="lastName" type="text" placeholder="Johnson">
                            </div>

                            <div class="form-group">
                                <label for="email">EMAIL</label>
                                <input id="email" name="email" type="email" placeholder="thor@mail.com">
                            </div>

                            <div class="form-group">
                                <label for="phoneNumber">PHONE NUMBER</label>
                                <input id="phoneNumber" name="phoneNumber" type="tel">
                            </div>

                            <div class="form-group">
                                <label for="password">PASSWORD</label>
                                <input id="password" name="password" type="password">
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">CONFIRM PASSWORD</label>
                                <input id="confirmPassword" name="confirmPassword" type="password">
                            </div>

                        </fieldset>
                    </form>
                </div>
                <div class="bottom">

                    <button type="submit">Create Account</button>
                    <p>Already have an account?<a href="#">Log in</a></p>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
